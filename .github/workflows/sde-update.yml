name: SDE update

# Polls CCP's static-data manifest, and when a new build appears, runs
# `tool/build_sde.dart` to produce a prebaked sqlite + zip + manifest.json
# and publishes them as a GitHub Release. The app fetches manifest.json
# from `releases/latest/download/manifest.json` to learn what to install.

on:
  schedule:
    # Every 6 hours. CCP publishes weekly-ish, so this is conservative;
    # the workflow short-circuits when buildNumber hasn't changed.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if a release already exists for this build'
        type: boolean
        default: false

permissions:
  contents: write  # needed to create releases

concurrency:
  group: sde-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install libsqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: pub get
        run: flutter pub get

      - name: Read CCP build number
        id: ccp
        run: |
          curl -fsSL https://developers.eveonline.com/static-data/tranquility/latest.jsonl \
            | head -1 > /tmp/ccp.json
          BUILD=$(python3 -c "import json,sys; d=json.load(open('/tmp/ccp.json')); print(d['buildNumber'])")
          DATE=$(python3 -c "import json,sys; d=json.load(open('/tmp/ccp.json')); print(d['releaseDate'])")
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "CCP build $BUILD ($DATE)"

      - name: Skip if release already exists
        id: precheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ steps.ccp.outputs.build }}
          FORCE: ${{ inputs.force }}
        run: |
          set +e
          gh release view "sde-$BUILD" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          EXISTS=$?
          if [ "$EXISTS" -eq 0 ] && [ "$FORCE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release sde-$BUILD already exists — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build SDE
        if: steps.precheck.outputs.skip != 'true'
        env:
          BUILD: ${{ steps.ccp.outputs.build }}
        run: |
          mkdir -p build/sde
          dart run tool/build_sde.dart \
            --out build/sde \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/sde-$BUILD"

      - name: Create release
        if: steps.precheck.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ steps.ccp.outputs.build }}
          DATE: ${{ steps.ccp.outputs.date }}
        run: |
          set -e
          # Delete any previous attempt at this tag (force runs).
          gh release delete "sde-$BUILD" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "sde-$BUILD" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SDE build $BUILD" \
            --notes "Prebaked EVE Online static data export for build $BUILD (released $DATE). \
          Generated by tool/build_sde.dart on $(date -u +'%Y-%m-%dT%H:%M:%SZ')." \
            build/sde/eve-sde-$BUILD.sqlite.zip \
            build/sde/manifest.json
